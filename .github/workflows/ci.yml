name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Run the tests on real hardware of each major platform. Token tests skip
  # themselves where the runner lacks a feature, so these cover what the
  # runner's CPU has (no AVX-512 on GitHub's x86 runners).
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo test --release
      - run: cargo test --no-default-features

  # A `-C target-cpu` build must report at least the host's level
  # (compile flags are a floor) and still pass.
  test-target-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
        env:
          RUSTFLAGS: -D warnings -C target-cpu=x86-64-v2

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      # Not `-D warnings` yet: `formats` / `reduce_common` carry known lints.
      - run: cargo clippy --all-targets
        env:
          RUSTFLAGS: ""
      - run: cargo doc --no-deps
        env:
          RUSTFLAGS: ""

  # Type-check every target the crate supports, including ones no runner can
  # execute. Bare-metal targets build the library only (tests need `std`).
  cross-check:
    name: check (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-unknown-linux-gnu, tests: true }
          - { target: aarch64-apple-darwin, tests: true }
          - { target: aarch64-apple-ios, tests: true }
          - { target: aarch64-pc-windows-msvc, tests: true }
          - { target: x86_64-apple-darwin, tests: true }
          - { target: i686-unknown-linux-gnu, tests: true }
          - { target: i586-unknown-linux-gnu, tests: true }
          - { target: armv7-unknown-linux-gnueabihf, tests: true }
          - { target: riscv64gc-unknown-linux-gnu, tests: true }
          - { target: loongarch64-unknown-linux-gnu, tests: true }
          - { target: powerpc-unknown-linux-gnu, tests: true, asm: true }
          - { target: powerpc64-unknown-linux-gnu, tests: true, asm: true }
          - { target: powerpc64le-unknown-linux-gnu, tests: true, asm: true }
          - { target: wasm32-unknown-unknown, tests: true }
          - { target: thumbv6m-none-eabi, tests: false }
          - { target: thumbv7em-none-eabi, tests: false }
          - { target: riscv32imac-unknown-none-elf, tests: false }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.tests
        run: cargo check --tests --target ${{ matrix.target }}
      - if: ${{ !matrix.tests }}
        run: cargo check --target ${{ matrix.target }}
      # `cargo check` never runs LLVM, so it would not catch a bad mnemonic in
      # an `asm!` block. Building the library assembles every kernel.
      - if: matrix.asm
        run: cargo build --lib --release --target ${{ matrix.target }}

  # Run the PowerPC tests under qemu-user: VMX on the G4 (7400), VMX + VSX on
  # big-endian POWER8, VSX / ISA 3.0 (lxvl, FP16) / MMA on little-endian
  # POWER8-10. `MIRACULIX_EXPECT_POWER` fails the job if the kernels the CPU
  # model must have were not detected (so the token tests cannot all skip).
  # Paired singles
  # (GameCube/Wii/Wii U) and VMX128 (Xbox 360) have no QEMU model: their
  # encodings are tested on the host, their kernels only on the device.
  test-powerpc-qemu:
    name: qemu (${{ matrix.target }}, ${{ matrix.cpu }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # G4: 32-bit big-endian AltiVec.
          - { target: powerpc-unknown-linux-gnu, env: POWERPC_UNKNOWN_LINUX_GNU, gnu: powerpc-linux-gnu, qemu: qemu-ppc, cpu: "7400", expect: vmx }
          # 64-bit big-endian AltiVec. POWER8 rather than the G5 (970): the
          # distro's ppc64 glibc may use newer instructions than a 970 has.
          - { target: powerpc64-unknown-linux-gnu, env: POWERPC64_UNKNOWN_LINUX_GNU, gnu: powerpc64-linux-gnu, qemu: qemu-ppc64, cpu: power8, expect: power8 }
          - { target: powerpc64le-unknown-linux-gnu, env: POWERPC64LE_UNKNOWN_LINUX_GNU, gnu: powerpc64le-linux-gnu, qemu: qemu-ppc64le, cpu: power8, expect: power8 }
          - { target: powerpc64le-unknown-linux-gnu, env: POWERPC64LE_UNKNOWN_LINUX_GNU, gnu: powerpc64le-linux-gnu, qemu: qemu-ppc64le, cpu: power9, expect: power9 }
          - { target: powerpc64le-unknown-linux-gnu, env: POWERPC64LE_UNKNOWN_LINUX_GNU, gnu: powerpc64le-linux-gnu, qemu: qemu-ppc64le, cpu: power10, expect: power10 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y qemu-user gcc-${{ matrix.gnu }}
      - run: |
          echo "CARGO_TARGET_${{ matrix.env }}_LINKER=${{ matrix.gnu }}-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_${{ matrix.env }}_RUNNER=${{ matrix.qemu }} -cpu ${{ matrix.cpu }} -L /usr/${{ matrix.gnu }}" >> "$GITHUB_ENV"
          echo "MIRACULIX_EXPECT_POWER=${{ matrix.expect }}" >> "$GITHUB_ENV"
      - run: cargo test --target ${{ matrix.target }}
      - run: cargo test --release --target ${{ matrix.target }}

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - run: cargo check --tests
